<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password</title>
    <link rel="stylesheet" th:href="@{/css/style4.css}" />
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="companylogo">
                <img src="Image/logo.png" alt="Company Logo">
            </div>
            <div class="card">
                <div class="card-header">
                    <h2 class="text-center">Create New Password</h2>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/update-password}" class="form-horizontal">
                        <input type="hidden" id="email" name="email" th:value="${email}" />
                        <div class="form-group mb-3">
                            <label class="control-label">New Password</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter new password" required />
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-primary">Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
